{% extends "base.html" %}{% block title %}ویرایش یادآور | رها{% endblock %}{% block content %}<section class="mx-auto max-w-xl px-4 py-12"><div class="rounded-3xl bg-white p-7"><h1 class="text-2xl font-extrabold text-raha-primary-dark">ویرایش یادآور</h1><form method="post" class="mt-7 space-y-5">{% csrf_token %}{% for field in form %}<div><label class="mb-2 block font-semibold" for="{{ field.id_for_label }}">{{ field.label }}</label>{{ field }}{% for error in field.errors %}<p class="text-sm text-red-600">{{ error }}</p>{% endfor %}</div>{% endfor %}<button class="w-full rounded-xl bg-raha-primary px-5 py-3 font-bold text-white">ذخیره</button></form></div></section>{% endblock %}
