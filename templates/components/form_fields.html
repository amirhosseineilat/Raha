{% for field in form %}<div class="space-y-2"><label for="{{ field.id_for_label }}" class="block text-sm font-semibold text-raha-primary-dark">{{ field.label }}</label>{{ field }}{% if field.help_text %}<p class="text-xs leading-6 text-raha-text-muted">{{ field.help_text|safe }}</p>{% endif %}{% for error in field.errors %}<p class="text-sm text-red-600">{{ error }}</p>{% endfor %}</div>{% endfor %}
