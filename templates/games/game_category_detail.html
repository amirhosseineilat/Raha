{% extends "base.html" %}{% block title %}{{ category.name }} | رها{% endblock %}{% block content %}<section class="mx-auto max-w-6xl px-4 py-12"><a href="{% url 'game_category_list' %}" class="text-sm font-bold text-raha-primary">← دسته‌بندی‌ها</a><h1 class="mt-3 text-3xl font-extrabold text-raha-primary-dark">{{ category.name }}</h1><p class="mt-2 text-raha-text-muted">{{ category.description }}</p><div class="mt-8 grid gap-5 sm:grid-cols-2 lg:grid-cols-3">{% for game in games %}<a href="{% url 'game_detail' game.slug %}" class="rounded-2xl border border-raha-border bg-white p-5 font-bold text-raha-primary-dark hover:border-raha-primary">{{ game.name }} <span class="float-left text-raha-primary">←</span></a>{% empty %}<p>بازی‌ای در این دسته وجود نداره.</p>{% endfor %}</div></section>{% endblock %}
