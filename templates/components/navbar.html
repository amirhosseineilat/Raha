<header class="site-header">

    <nav class="navbar raha-navbar">
        <div class="container">

            <!-- Brand -->
            <a href="/" class="navbar-brand">
                <span class="brand-icon">R</span>
                <span class="brand-name">رها</span>
            </a>

            <!-- Desktop Navigation -->
            <div class="desktop-navigation d-none d-lg-flex">

                <ul class="navbar-nav flex-row align-items-center gap-3">

                    <li class="nav-item">
                        <a class="nav-link active" href="/">
                            خانه
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="/#features">
                            امکانات
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="/#how-it-works">
                            چطور کار می‌کند؟
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'about' %}">
                            درباره ما
                        </a>
                    </li>

                </ul>

            </div>

            <!-- Desktop Authentication -->
            <div class="navbar-actions d-none d-lg-flex align-items-center gap-3">

                {% if user.is_authenticated %}

                    <a href="#" class="btn btn-primary">
                        پنل کاربری
                    </a>

                {% else %}

                    <a href="#" class="login-link">
                        ورود
                    </a>

                    <a href="#" class="btn btn-primary">
                        ثبت‌نام
                    </a>

                {% endif %}

            </div>

            <!-- Mobile Menu Button -->
            <button
                class="navbar-toggler d-lg-none"
                type="button"
                data-bs-toggle="offcanvas"
                data-bs-target="#mobileMenu"
                aria-controls="mobileMenu"
                aria-label="باز کردن منو"
            >
                <span class="menu-icon">
                    <span></span>
                    <span></span>
                    <span></span>
                </span>
            </button>

        </div>
    </nav>

</header>


<!-- Mobile Offcanvas -->
<div
    class="offcanvas offcanvas-end raha-offcanvas"
    tabindex="-1"
    id="mobileMenu"
    aria-labelledby="mobileMenuLabel"
>

    <!-- Offcanvas Header -->
    <div class="offcanvas-header">

        <a href="/" class="navbar-brand" id="mobileMenuLabel">
            <span class="brand-icon">R</span>
            <span class="brand-name">رها</span>
        </a>

        <button
            type="button"
            class="btn-close"
            data-bs-dismiss="offcanvas"
            aria-label="بستن منو"
        ></button>

    </div>


    <!-- Offcanvas Body -->
    <div class="offcanvas-body">

        <ul class="navbar-nav mobile-navigation">

            <li class="nav-item">
                <a
                    class="nav-link active"
                    href="/"
                    data-bs-dismiss="offcanvas"
                >
                    خانه
                </a>
            </li>

            <li class="nav-item">
                <a
                    class="nav-link"
                    href="/#features"
                    data-bs-dismiss="offcanvas"
                >
                    امکانات
                </a>
            </li>

            <li class="nav-item">
                <a
                    class="nav-link"
                    href="/#how-it-works"
                    data-bs-dismiss="offcanvas"
                >
                    چطور کار می‌کند؟
                </a>
            </li>

            <li class="nav-item">
                <a
                    class="nav-link"
                    href="{% url 'about' %}"
                    data-bs-dismiss="offcanvas"
                >
                    درباره ما
                </a>
            </li>

        </ul>


        <!-- Mobile Authentication -->
        <div class="mobile-auth">

            {% if user.is_authenticated %}

                <a href="#" class="btn btn-primary w-100">
                    پنل کاربری
                </a>

            {% else %}

                <a href="#" class="login-link">
                    ورود
                </a>

                <a href="#" class="btn btn-primary w-100">
                    ثبت‌نام
                </a>

            {% endif %}

        </div>

    </div>

</div>
