{% extends "base.html" %}
{% block title %}بازیابی رمز عبور | رها{% endblock %}
{% block content %}
<section class="mx-auto max-w-xl px-4 py-16"><div class="rounded-3xl border border-raha-border bg-white p-6 shadow-sm sm:p-10">
  <h1 class="text-2xl font-extrabold text-raha-primary-dark">بازیابی رمز عبور</h1><p class="mt-3 text-sm leading-7 text-raha-text-muted">ایمیلی که با آن ثبت‌نام کردی وارد کن تا راهنمای بازیابی رمز برات ارسال بشه.</p>
  <form method="post" class="mt-8 space-y-5">{% csrf_token %}{% include "components/form_fields.html" %}<button class="w-full rounded-xl bg-raha-primary px-5 py-3.5 font-bold text-white hover:bg-raha-primary-dark">ارسال لینک بازیابی</button></form>
</div></section>
{% endblock %}
