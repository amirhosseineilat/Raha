{% extends "base.html" %}
{% block title %}ثبت‌نام | رها{% endblock %}
{% block content %}
<section class="mx-auto max-w-xl px-4 py-16">
  <div class="rounded-3xl border border-raha-border bg-white p-6 shadow-sm sm:p-10">
    <div class="mb-8 text-center"><span class="mb-4 inline-flex h-14 w-14 items-center justify-center rounded-2xl bg-raha-primary-light text-2xl">🌱</span><h1 class="text-2xl font-extrabold text-raha-primary-dark">به رها خوش اومدی</h1><p class="mt-2 text-sm leading-7 text-raha-text-muted">حساب کاربری بساز تا مسیر مراقبت از خودت رو شروع کنی.</p></div>
    <form method="post" class="space-y-5">{% csrf_token %}{% include "components/form_fields.html" %}<button class="w-full rounded-xl bg-raha-primary px-5 py-3.5 font-bold text-white transition hover:bg-raha-primary-dark">ساخت حساب و دریافت کد تأیید</button></form>
    <p class="mt-6 text-center text-sm text-raha-text-muted">قبلاً ثبت‌نام کردی؟ <a class="font-bold text-raha-primary hover:underline" href="{% url 'login' %}">وارد شو</a></p>
  </div>
</section>
{% endblock %}
